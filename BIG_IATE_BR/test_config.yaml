version: "1.0.0"

# ============================================================
# НАСТРОЙКИ БАЗЫ ДАННЫХ
# ============================================================
database:
  username: "postgres"
  host: "localhost"
  port: 5432
  name: "big_iate_db"
  schema: "public"
  
  pool:
    min_connections: 2
    max_connections: 10
    connection_timeout_seconds: 5
    idle_timeout_seconds: 60
  
  vector:
    dimension: 512
    similarity_threshold: 0.75
    index_type: "ivfflat"

# ============================================================
# КАМЕРЫ
# ============================================================
cameras:
  # Камера 1 - Главный вход
  - id: 1
    name: "Главный вход"
    enabled: true
    connection:
      protocol: "usb"
      device: "0"
    capture:
      fps: 30
      width: 640
      height: 480
      rotation: 0
  
  # Камера 2 - Запасной выход
  - id: 2
    name: "Запасной выход"
    enabled: true
    connection:
      protocol: "usb"
      device: "1"
    capture:
      fps: 30
      width: 640
      height: 480
      rotation: 0
  - id: 3
    name: "Запасной выход"
    enabled: true
    connection:
      protocol: "usb"
      device: "3"
    capture:
      fps: 30
      width: 640
      height: 480
      rotation: 0
  - id: 4
    name: "Запасной выход"
    enabled: true
    connection:
      protocol: "usb"
      device: "4"
    capture:
      fps: 30
      width: 640
      height: 480
      rotation: 0
# ============================================================
# БАСТИОН (ОТКЛЮЧЁН)
# ============================================================
bastion:
  enabled: false
  protocol: "tcp"
  host: "192.168.1.200"
  port: 9000
  username: ""
  
  timeout:
    connect_seconds: 3
    send_seconds: 2
    receive_seconds: 3
  
  retry:
    max_attempts: 3
    delay_ms: 100
    backoff_multiplier: 2

# ============================================================
# РАСПОЗНАВАНИЕ
# ============================================================
recognition:
  detector:
    type: "ssd"
    model_path: "models/res10_300x300_ssd_iter_140000.caffemodel"
    config_path: "models/deploy.prototxt"
    backend: "opencv"
    confidence_threshold: 0.5
    input_width: 300
    input_height: 300
    use_gpu: false
    batch_size: 1
  
  extractor:
    type: "arcface"
    model_path: "models/arcface.onnx"
    backend: "opencv"
    embedding_size: 512
    normalize: true
    use_gpu: false
    batch_size: 1
  
  matching:
    threshold: 0.1
    max_distance: 1.5
    top_k: 1
    use_index: true
  
  anti_passback:
    enabled: false
    cooldown_seconds: 30
    strict_mode: false
  
  performance:
    skip_frames: 2
    max_faces_per_frame: 10
    parallel_detection: false
    queue_size: 100
    min_face_size: 4000

# ============================================================
# ЛОГИРОВАНИЕ
# ============================================================
logging:
  level: "debug"
  format: "text"
  
  outputs:
    - type: "console"
      enabled: true
      
    - type: "file"
      enabled: false
      path: "logs/application.log"
      rotation: "daily"
      max_size_mb: 100
      max_files: 30
  
  metrics:
    enabled: false
    interval_seconds: 60

# ============================================================
# БЕЗОПАСНОСТЬ
# ============================================================
security:
  encrypt_secrets: false
  secrets_file: "secrets.yaml.enc"
  config_file_mode: 0600
  log_file_mode: 0640
  
  allowed_networks: []
  
  encryption:
    algorithm: "AES-256-GCM"
    key_derivation: "PBKDF2"
    iterations: 10000
    salt_length: 32
    prompt_at_startup: false
  
  first_run: true